# MyPMAgent — Hermes gateway with OpenAI-compatible API server on :8642
# Usage:
#   cp .env.example .env                                    # fill in OPENAI_API_KEY and API_SERVER_KEY
#   cp cli-config.mypmagent.yaml.example cli-config.yaml   # copy mypmagent config (gitignored by design)
#   docker compose up --build
#
# The API server exposes /v1/chat/completions and /v1/models at localhost:8642.
# The Next.js frontend points its HERMES_BASE_URL at http://localhost:8642.

services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile.mypmagent
    container_name: hermes-mypmagent
    ports:
      - "8642:8642"
    env_file: .env
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_PORT=8642
      - API_SERVER_HOST=0.0.0.0
    volumes:
      - ./cli-config.yaml:/root/.hermes/cli-config.yaml:ro
      - ./skills/mypmagent:/root/.hermes/skills/mypmagent:ro
      - hermes_data:/root/.hermes/data
    restart: unless-stopped
    command: ["hermes", "gateway", "run"]

volumes:
  hermes_data:
